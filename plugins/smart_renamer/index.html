<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MediaHub Smart Renamer</title><link rel="stylesheet" href="/smart-renamer/assets/mediahub.css"></head>
<body><main class="app-shell">
<header class="topbar"><div><h1>✏️ Smart Renamer</h1><p>Sichere Vorschau · Desktop, WebRemote und Mobile</p></div><label>Profil <select id="profile"></select></label></header>
<section class="toolbar"><button id="preview">Vorschau</button><label class="switch"><input id="live" type="checkbox" checked> Live</label><span id="backend">Backend wird geprüft …</span></section>
<section class="workspace">
<aside class="panel paths"><h2>Pfade</h2><textarea id="paths" rows="8" placeholder="Je Zeile ein Datei- oder Ordnerpfad"></textarea><h2>Regelstapel</h2><div id="rules"></div><div class="row"><button id="addRule">+ Regel</button><button id="deleteRule">Löschen</button><button id="upRule">↑</button><button id="downRule">↓</button></div></aside>
<section class="panel preview"><h2>Vorschau</h2><div class="table-wrap"><table><thead><tr><th>Status</th><th>Original</th><th>Vorschlag</th><th>Quelle</th><th>Hinweise</th></tr></thead><tbody id="results"></tbody></table></div></section>
<aside class="panel editor"><h2>Eigenschaften</h2><label><input id="enabled" type="checkbox" checked> Aktiv</label><label>Typ<select id="type"><option value="replace">Suchen/Ersetzen</option><option value="remove">Entfernen</option><option value="prefix">Präfix</option><option value="suffix">Suffix</option><option value="trim">Leerzeichen</option><option value="case">Schreibweise</option><option value="numbering">Nummerierung</option><option value="schema">Namensschema</option></select></label><label>Quelle<select id="source"><option>Benutzer</option><option>Profil</option><option>KI</option><option>ReNamer</option><option>Plugin</option></select></label><label>Suchen<input id="old"></label><label>Ersetzen<input id="new"></label><label>Wert<input id="value"></label><label>Schreibweise<select id="case"><option value="">Unverändert</option><option value="lower">klein</option><option value="upper">GROSS</option><option value="title">Titel</option><option value="sentence">Satz</option></select></label><label>Start<input id="start" type="number" value="1"></label><label>Stellen<input id="padding" type="number" value="2"></label><label>Schema<input id="schema" placeholder="[titel] ([jahr])"></label><small>[titel] [jahr] [staffel] [episode] [episodentitel] [nummer] [original] [endung]</small></aside>
</section><footer id="status">Bereit · Ausführung gesperrt</footer></main>
<script>
const $=id=>document.getElementById(id); let profiles=[],rules=[],selected=-1,timer;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function init(){profiles=Array.isArray(window.__SMART_RENAMER_PROFILES__)?window.__SMART_RENAMER_PROFILES__:[]; if(!profiles.length){profiles=(await (await fetch('/smart-renamer/api/profiles',{cache:'no-store'})).json()).items||[];} $('profile').innerHTML=profiles.map((p,i)=>`<option value="${i}">${esc(p.name)}</option>`).join(''); if(profiles.length){applyProfile(0);} const b=await (await fetch('/smart-renamer/api/backends',{cache:'no-store'})).json(); $('backend').textContent='Backend: '+(b.capabilities?.active_preview_backend_id||'nicht verfügbar');}
function applyProfile(i){rules=(profiles[i]?.rules||[]).map(r=>({...r,enabled:r.enabled!==false,source:r.source||'Profil'})); renderRules(); schedule();}
function renderRules(){const icons={Benutzer:'🟦',Profil:'🟩',KI:'🟨',ReNamer:'🟪',Plugin:'⬜'}; $('rules').innerHTML=rules.map((r,i)=>`<button class="rule ${i===selected?'active':''}" data-i="${i}">${icons[r.source]||'⬜'} ${r.enabled===false?'☐':'☑'} ${esc(r.label||r.type)}</button>`).join(''); document.querySelectorAll('.rule').forEach(b=>b.onclick=()=>selectRule(+b.dataset.i)); if(selected>=rules.length) selected=rules.length-1;}
function selectRule(i){selected=i; renderRules(); const r=rules[i]||{}; $('enabled').checked=r.enabled!==false; $('type').value=r.type||'trim'; $('source').value=r.source||'Benutzer'; $('old').value=r.old||''; $('new').value=r.new||''; $('value').value=r.value||''; $('case').value=r.mode||''; $('start').value=r.start||1; $('padding').value=r.padding||2; $('schema').value=r.template||'';}
function saveEditor(){if(selected<0)return; const names={replace:'Suchen und Ersetzen',remove:'Text entfernen',prefix:'Präfix',suffix:'Suffix',trim:'Leerzeichen bereinigen',case:'Schreibweise',numbering:'Nummerierung',schema:'Namensschema'}; rules[selected]={...rules[selected],enabled:$('enabled').checked,type:$('type').value,source:$('source').value,old:$('old').value,new:$('new').value,value:$('value').value,mode:$('case').value,start:+$('start').value,padding:+$('padding').value,template:$('schema').value,label:names[$('type').value]}; renderRules(); schedule();}
function schedule(){if(!$('live').checked)return; clearTimeout(timer); timer=setTimeout(preview,300)}
async function preview(){const items=$('paths').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(path=>({path,recursive:true})); if(!items.length){$('results').innerHTML='';$('status').textContent='Keine Pfade ausgewählt · Ausführung gesperrt';return;} const data=await (await fetch('/smart-renamer/api/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items,rules})})).json(); const rows=data.preview_rows||data.changes||[]; $('results').innerHTML=rows.map(r=>{const sev=r.highest_severity||(r.blocked?'blocking':'info'); const icon={info:'✓',warning:'⚠',error:'!',blocking:'✖'}[sev]||'✓'; const issues=(r.issues||[]).map(x=>x.message||x).join('; ')||(r.warnings||[]).join('; '); const src=(r.rule_sources||[]).join(', ')||r.change_source||'unverändert'; return `<tr class="${sev}"><td>${icon}</td><td>${esc(r.original_name)}</td><td>${esc(r.proposed_name)}</td><td>${esc(src)}</td><td>${esc(issues)}</td></tr>`}).join(''); const s=data.summary||{}; $('status').textContent=`Dateien: ${s.item_count??s.total_count??rows.length} · Änderungen: ${s.changed_count??0} · Blockierend: ${s.blocking_count??0} · Warnungen: ${s.warning_row_count??0} · Backend: ${data.selected_backend||'–'} · Ausführung gesperrt`;}
$('profile').onchange=e=>applyProfile(+e.target.value); $('addRule').onclick=()=>{rules.push({type:'trim',label:'Leerzeichen bereinigen',source:'Benutzer',enabled:true});selected=rules.length-1;renderRules();selectRule(selected);schedule()}; $('deleteRule').onclick=()=>{if(selected>=0){rules.splice(selected,1);selected=Math.min(selected,rules.length-1);renderRules();if(selected>=0)selectRule(selected);schedule()}}; $('upRule').onclick=()=>{if(selected>0){[rules[selected-1],rules[selected]]=[rules[selected],rules[selected-1]];selected--;renderRules();schedule()}}; $('downRule').onclick=()=>{if(selected>=0&&selected<rules.length-1){[rules[selected+1],rules[selected]]=[rules[selected],rules[selected+1]];selected++;renderRules();schedule()}}; $('preview').onclick=preview; $('paths').oninput=schedule; ['enabled','type','source','old','new','value','case','start','padding','schema'].forEach(id=>$(id).addEventListener(id==='enabled'?'change':'input',saveEditor)); init().catch(e=>$('status').textContent=String(e));
</script></body></html>
