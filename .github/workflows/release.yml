name: Plugin Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Plugins prüfen
        run: python validate_plugins.py

      - name: Alle Plugins sauber bauen
        run: python build_plugins.py all --clean

      - name: Quellpaket erstellen
        shell: pwsh
        run: |
          $name = "MediaHub_Plugins_Source_${{ github.ref_name }}.zip"
          git archive --format=zip --output="release/$name" HEAD

      - name: Release-Dateien als Workflow-Artefakt hochladen
        uses: actions/upload-artifact@v6
        with:
          name: MediaHub-Plugins-${{ github.ref_name }}
          path: |
            release/*.mhplugin
            release/*.sha256
            release/MediaHub_Plugins_Source_*.zip
            RELEASE_NOTES.md
          if-no-files-found: error

      - name: GitHub-Release sicher erstellen oder aktualisieren
        uses: actions/github-script@v8
        env:
          RELEASE_NOTES_PATH: RELEASE_NOTES.md
        with:
          script: |
            const fs = require("fs");
            const tag = context.ref.replace("refs/tags/", "");
            const body = fs.readFileSync(
              process.env.RELEASE_NOTES_PATH,
              "utf8"
            );
            const prerelease =
              tag.includes("test") ||
              tag.includes("beta") ||
              tag.includes("alpha");

            try {
              const release =
                await github.rest.repos.getReleaseByTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag,
                });

              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                tag_name: tag,
                target_commitish: context.sha,
                name: `MediaHub Plugins ${tag}`,
                body,
                draft: false,
                prerelease,
              });

              core.info(
                `Bestehendes Release ${tag} wurde aktualisiert.`
              );
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: `MediaHub Plugins ${tag}`,
                body,
                draft: false,
                prerelease,
                generate_release_notes: false,
              });

              core.info(
                `Neues Release ${tag} wurde erstellt.`
              );
            }

      - name: Alle alten Release-Assets entfernen
        uses: actions/github-script@v8
        with:
          script: |
            const tag = context.ref.replace("refs/tags/", "");

            const release =
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });

            const assets = await github.paginate(
              github.rest.repos.listReleaseAssets,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                per_page: 100,
              }
            );

            if (assets.length === 0) {
              core.info(
                `Release ${tag} enthält keine alten Assets.`
              );
              return;
            }

            for (const asset of assets) {
              core.info(
                `Lösche altes Release-Asset: ${asset.name}`
              );

              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: asset.id,
              });
            }

            core.info(
              `${assets.length} alte Release-Assets wurden entfernt.`
            );

      - name: Frische Release-Assets hochladen
        uses: softprops/action-gh-release@v3
        with:
          name: MediaHub Plugins ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            release/*.mhplugin
            release/*.sha256
            release/MediaHub_Plugins_Source_*.zip

      - name: Release abschließend prüfen
        uses: actions/github-script@v8
        env:
          RELEASE_NOTES_PATH: RELEASE_NOTES.md
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const tag = context.ref.replace("refs/tags/", "");
            const expectedBody = fs.readFileSync(
              process.env.RELEASE_NOTES_PATH,
              "utf8"
            );

            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag,
            });

            const assets = await github.paginate(
              github.rest.repos.listReleaseAssets,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                per_page: 100,
              }
            );

            if (release.data.body !== expectedBody) {
              throw new Error(
                "Release-Beschreibung stimmt nicht mit RELEASE_NOTES.md überein."
              );
            }

            const manifests = fs
              .readdirSync("plugins", { withFileTypes: true })
              .filter((entry) => entry.isDirectory())
              .map((entry) => path.join("plugins", entry.name, "plugin.json"))
              .filter((manifestPath) => fs.existsSync(manifestPath))
              .map((manifestPath) => JSON.parse(fs.readFileSync(manifestPath, "utf8")));

            const expected = new Set();
            for (const manifest of manifests) {
              const packageName = String(manifest.package_name || manifest.name)
                .replaceAll(" ", "")
                .replace(/[^A-Za-z0-9ÄÖÜäöüß_-]+/g, "");
              const base = `MediaHub_${packageName}_v${manifest.version}.mhplugin`;
              expected.add(base);
              expected.add(`${base}.sha256`);
            }

            const actualPluginAssets = assets
              .map((asset) => asset.name)
              .filter((name) => name.endsWith(".mhplugin") || name.endsWith(".mhplugin.sha256"));

            const missing = [...expected].filter((name) => !actualPluginAssets.includes(name));
            const stale = actualPluginAssets.filter((name) => !expected.has(name));

            if (missing.length > 0) {
              throw new Error("Fehlende Release-Assets: " + missing.join(", "));
            }
            if (stale.length > 0) {
              throw new Error("Veraltete Release-Assets: " + stale.join(", "));
            }

            if (release.data.target_commitish !== context.sha) {
              core.warning(
                `target_commitish=${release.data.target_commitish}, Workflow-SHA=${context.sha}`
              );
            }

            core.info(
              `Release ${tag} wurde mit ${assets.length} aktuellen Assets geprüft.`
            );
