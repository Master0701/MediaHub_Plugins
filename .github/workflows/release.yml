name: Plugin Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Abhängigkeiten installieren
        run: python -m pip install --upgrade pip pytest

      - name: Plugins prüfen
        run: python validate_plugins.py

      - name: Globalen Plugin-Test ausführen
        run: python -m pytest -q

      - name: Alle Plugins sauber bauen
        run: python build_plugins.py all --clean

      - name: Quellpaket erstellen
        shell: pwsh
        run: |
          $name = "MediaHub_Plugins_Source_${{ github.ref_name }}.zip"
          git archive --format=zip --output="release/$name" HEAD

      - name: Release-Dateien als Workflow-Artefakt hochladen
        uses: actions/upload-artifact@v6
        with:
          name: MediaHub-Plugins-${{ github.ref_name }}
          path: |
            release/*.mhplugin
            release/*.sha256
            release/MediaHub_Plugins_Source_*.zip
            RELEASE_NOTES.md
          if-no-files-found: error

      - name: GitHub-Release sicher erstellen oder aktualisieren
        uses: actions/github-script@v8
        env:
          RELEASE_NOTES_PATH: RELEASE_NOTES.md
        with:
          script: |
            const fs = require("fs");
            const tag = context.ref.replace("refs/tags/", "");
            const title = `MediaHub Plugins ${tag} – vollständiges Release`;
            const body = fs.readFileSync(process.env.RELEASE_NOTES_PATH, "utf8");
            const prerelease = tag.includes("test") || tag.includes("beta") || tag.includes("alpha");

            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });

              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                tag_name: tag,
                target_commitish: context.sha,
                name: title,
                body,
                draft: false,
                prerelease,
              });

              core.info(`Bestehendes Release ${tag} wurde aktualisiert.`);
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: title,
                body,
                draft: false,
                prerelease,
                generate_release_notes: false,
              });

              core.info(`Neues Release ${tag} wurde erstellt.`);
            }

      - name: Alle alten Release-Assets entfernen
        uses: actions/github-script@v8
        with:
          script: |
            const tag = context.ref.replace("refs/tags/", "");
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag,
            });

            const assets = await github.paginate(
              github.rest.repos.listReleaseAssets,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                per_page: 100,
              }
            );

            for (const asset of assets) {
              core.info(`Lösche altes Release-Asset: ${asset.name}`);
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: asset.id,
              });
            }

      - name: Platzhalter-Plugins vom Release ausschließen
        shell: pwsh
        run: |
          Get-ChildItem release -File |
            Where-Object {
              $_.Name -match '_v0\.0\.0\.mhplugin(?:\.sha256)?$'
            } |
            ForEach-Object {
              Write-Host "Entferne Platzhalter-Asset: $($_.Name)"
              Remove-Item -LiteralPath $_.FullName -Force
            }

      - name: Frische Release-Assets hochladen
        uses: softprops/action-gh-release@v3
        with:
          name: MediaHub Plugins ${{ github.ref_name }} – vollständiges Release
          tag_name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            release/*.mhplugin
            release/*.sha256
            release/MediaHub_Plugins_Source_*.zip

      - name: Release abschließend prüfen
        uses: actions/github-script@v8
        env:
          RELEASE_NOTES_PATH: RELEASE_NOTES.md
        with:
          script: |
            const fs = require("fs");
            const tag = context.ref.replace("refs/tags/", "");
            const expectedTitle = `MediaHub Plugins ${tag} – vollständiges Release`;
            const expectedBody = fs.readFileSync(process.env.RELEASE_NOTES_PATH, "utf8");

            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag,
            });

            const assets = await github.paginate(
              github.rest.repos.listReleaseAssets,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                per_page: 100,
              }
            );

            if (release.data.name !== expectedTitle) {
              throw new Error(`Release-Titel falsch: ${release.data.name} != ${expectedTitle}`);
            }

            if (release.data.body !== expectedBody) {
              throw new Error("Release-Beschreibung stimmt nicht mit RELEASE_NOTES.md überein.");
            }

            const rawCatalog = fs.readFileSync("catalog/plugin_catalog.json");
            if (
              rawCatalog.length >= 3 &&
              rawCatalog[0] === 0xef &&
              rawCatalog[1] === 0xbb &&
              rawCatalog[2] === 0xbf
            ) {
              throw new Error("catalog/plugin_catalog.json enthält UTF-8-BOM.");
            }

            const catalog = JSON.parse(rawCatalog.toString("utf8"));
            if (catalog.schema_version !== 2) {
              throw new Error(`Falsche Katalogversion: ${catalog.schema_version}`);
            }

            const expected = new Set();
            for (const plugin of catalog.plugins || []) {
              if (String(plugin.version || "") === "0.0.0") {
                core.info(`Überspringe Platzhalter-Plugin: ${plugin.name} v0.0.0`);
                continue;
              }

              const base = String(plugin.release_asset || "");
              if (!base.endsWith(".mhplugin")) {
                throw new Error(`Ungültiger Paketname im Katalog für ${plugin.name}: ${base}`);
              }

              expected.add(base);
              expected.add(String(plugin.sha256_asset || `${base}.sha256`));
            }

            const actualPluginAssets = assets
              .map((asset) => asset.name)
              .filter((name) => name.endsWith(".mhplugin") || name.endsWith(".mhplugin.sha256"));

            const missing = [...expected].filter((name) => !actualPluginAssets.includes(name));
            const stale = actualPluginAssets.filter((name) => !expected.has(name));

            if (missing.length > 0) {
              throw new Error("Fehlende Release-Assets: " + missing.join(", "));
            }
            if (stale.length > 0) {
              throw new Error("Veraltete Release-Assets: " + stale.join(", "));
            }

            core.info(`Release ${tag} wurde mit ${assets.length} aktuellen Assets geprüft.`);
