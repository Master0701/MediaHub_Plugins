name: Plugin Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Vorhandenen Release-Tag erneut veröffentlichen"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Abhängigkeiten installieren
        run: python -m pip install --upgrade pip pytest

      - name: Beide Plugin-Gruppen prüfen
        run: python validate_plugins.py

      - name: Globalen Plugin-Test ausführen
        run: python -m pytest -q

      - name: MediaHub- und AI-Node-Plugins sauber bauen
        run: python build_plugins.py all --clean

      - name: Quellpaket erstellen
        shell: pwsh
        run: |
          $name = "MediaHub_Plugins_Source_${{ env.RELEASE_TAG }}.zip"
          git archive --format=zip --output="release/$name" HEAD

      - name: Release-Dateien als Workflow-Artefakt hochladen
        uses: actions/upload-artifact@v6
        with:
          name: MediaHub-Plugins-${{ env.RELEASE_TAG }}
          path: |
            release/*.mhplugin
            release/*.mhaiplugin
            release/*.sha256
            release/MediaHub_Plugins_Source_*.zip
            catalog/plugin_catalog.json
            catalog/ai_plugin_catalog.json
            RELEASE_NOTES.md
          if-no-files-found: error

      - name: GitHub-Release sicher erstellen oder aktualisieren
        uses: actions/github-script@v8
        env:
          RELEASE_NOTES_PATH: RELEASE_NOTES.md
        with:
          script: |
            const fs = require("fs");
            const tag = process.env.RELEASE_TAG;
            const title = `MediaHub Plugins ${tag} – vollständiges Release`;
            const body = fs.readFileSync(process.env.RELEASE_NOTES_PATH, "utf8");
            const prerelease =
              tag.includes("test") ||
              tag.includes("beta") ||
              tag.includes("alpha");

            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });

              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                tag_name: tag,
                target_commitish: context.sha,
                name: title,
                body,
                draft: false,
                prerelease,
              });
            } catch (error) {
              if (error.status !== 404) throw error;

              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: title,
                body,
                draft: false,
                prerelease,
                generate_release_notes: false,
              });
            }

      - name: Alle alten Release-Assets entfernen
        uses: actions/github-script@v8
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag,
            });

            const assets = await github.paginate(
              github.rest.repos.listReleaseAssets,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                per_page: 100,
              }
            );

            for (const asset of assets) {
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: asset.id,
              });
            }

      - name: Platzhalter-Plugins vom Release ausschließen
        shell: pwsh
        run: |
          Get-ChildItem release -File |
            Where-Object {
              $_.Name -match '_v0\.0\.0\.(?:mhplugin|mhaiplugin)(?:\.sha256)?$'
            } |
            ForEach-Object {
              Remove-Item -LiteralPath $_.FullName -Force
            }

      - name: Frische Release-Assets hochladen
        uses: softprops/action-gh-release@v3
        with:
          name: MediaHub Plugins ${{ env.RELEASE_TAG }} – vollständiges Release
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            release/*.mhplugin
            release/*.mhaiplugin
            release/*.sha256
            release/MediaHub_Plugins_Source_*.zip

      - name: Release abschließend prüfen
        uses: actions/github-script@v8
        env:
          RELEASE_NOTES_PATH: RELEASE_NOTES.md
        with:
          script: |
            const fs = require("fs");
            const tag = process.env.RELEASE_TAG;
            const expectedTitle =
              `MediaHub Plugins ${tag} – vollständiges Release`;
            const expectedBody =
              fs.readFileSync(process.env.RELEASE_NOTES_PATH, "utf8");

            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag,
            });

            const assets = await github.paginate(
              github.rest.repos.listReleaseAssets,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                per_page: 100,
              }
            );

            if (release.data.name !== expectedTitle) {
              throw new Error(
                `Release-Titel falsch: ${release.data.name} != ${expectedTitle}`
              );
            }

            if (release.data.body !== expectedBody) {
              throw new Error(
                "Release-Beschreibung stimmt nicht mit RELEASE_NOTES.md überein."
              );
            }

            function readCatalog(path, schema) {
              const raw = fs.readFileSync(path);

              if (
                raw.length >= 3 &&
                raw[0] === 0xef &&
                raw[1] === 0xbb &&
                raw[2] === 0xbf
              ) {
                throw new Error(`${path} enthält UTF-8-BOM.`);
              }

              const data = JSON.parse(raw.toString("utf8"));

              if (data.schema_version !== schema) {
                throw new Error(
                  `${path}: falsche schema_version ${data.schema_version}`
                );
              }

              return data;
            }

            const mediahubCatalog =
              readCatalog("catalog/plugin_catalog.json", 2);
            const aiCatalog =
              readCatalog("catalog/ai_plugin_catalog.json", 1);

            const expected = new Set();

            for (const plugin of mediahubCatalog.plugins || []) {
              if (String(plugin.version || "") === "0.0.0") continue;
              const base = String(plugin.release_asset || "");
              expected.add(base);
              expected.add(String(plugin.sha256_asset || `${base}.sha256`));
            }

            for (const plugin of aiCatalog.plugins || []) {
              if (String(plugin.version || "") === "0.0.0") continue;
              const base = String(
                plugin.package_asset ||
                plugin.release_asset ||
                ""
              );
              expected.add(base);
              expected.add(String(plugin.sha256_asset || `${base}.sha256`));
            }

            const actual = assets
              .map((asset) => asset.name)
              .filter(
                (name) =>
                  name.endsWith(".mhplugin") ||
                  name.endsWith(".mhplugin.sha256") ||
                  name.endsWith(".mhaiplugin") ||
                  name.endsWith(".mhaiplugin.sha256")
              );

            const missing = [...expected].filter(
              (name) => !actual.includes(name)
            );

            const stale = actual.filter(
              (name) => !expected.has(name)
            );

            if (missing.length > 0) {
              throw new Error("Fehlende Release-Assets: " + missing.join(", "));
            }

            if (stale.length > 0) {
              throw new Error("Veraltete Release-Assets: " + stale.join(", "));
            }
